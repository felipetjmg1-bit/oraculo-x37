name: Oraculo X-37 runtime evidence

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oraculo-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Install, test and launch Flask API
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HOST: 127.0.0.1
      PORT: "5000"
      DEBUG: "False"
      CLF_MODEL_PATH: /tmp/oraculo-ci/classification.pkl
      REG_MODEL_PATH: /tmp/oraculo-ci/regression.pkl
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install declared dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run existing API tests with isolated model outputs
        run: |
          mkdir -p /tmp/oraculo-ci
          python -m pytest -q
      - name: Start Flask API
        run: |
          mkdir -p /tmp/oraculo-ci
          nohup python -m app.main > /tmp/oraculo-api.log 2>&1 &
          echo $! > /tmp/oraculo-api.pid
          python - <<'PY'
          import time
          import urllib.request
          url = "http://127.0.0.1:5000/api/v1/health"
          for _ in range(60):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          print(response.read().decode())
                          break
              except Exception:
                  time.sleep(2)
          else:
              print(open("/tmp/oraculo-api.log", encoding="utf-8").read())
              raise SystemExit("Flask API did not become ready.")
          PY
      - name: Capture real API responses
        run: |
          mkdir -p artifacts/runtime
          curl --fail --silent --show-error http://127.0.0.1:5000/ > artifacts/runtime/root.json
          curl --fail --silent --show-error http://127.0.0.1:5000/api/v1/health > artifacts/runtime/health.json
          python -m json.tool artifacts/runtime/root.json
          python -m json.tool artifacts/runtime/health.json
      - name: Stop Flask API
        if: always()
        run: |
          if [ -f /tmp/oraculo-api.pid ]; then kill "$(cat /tmp/oraculo-api.pid)" || true; fi
      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oraculo-x37-api-runtime-evidence
          path: |
            artifacts/runtime/
            /tmp/oraculo-api.log
          if-no-files-found: warn
          retention-days: 30
