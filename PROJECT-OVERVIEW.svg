<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
<title id="title">ORÁCULO X-37 | Fluxo passo a passo</title><desc id="desc">API de Machine Learning + ferramentas MCP explicáveis. Cinco etapas explicadas com texto grande.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07152c"/><stop offset="1" stop-color="#142b4a"/></linearGradient><linearGradient id="line"><stop stop-color="#38bdf8"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
<rect width="1800" height="1040" rx="36" fill="url(#bg)"/>
<circle cx="1600" cy="140" r="170" fill="#2563eb" opacity=".09"/><circle cx="120" cy="930" r="190" fill="#0d9488" opacity=".08"/>
<text x="78" y="112" font-family="Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="6" fill="#8edaff">IMPULSO DIGITAL SOLUÇÕES EM IA</text>
<text x="74" y="220" font-family="Arial,sans-serif" font-size="68" font-weight="900" fill="#fff">ORÁCULO X-37</text>
<text x="78" y="276" font-family="Arial,sans-serif" font-size="31" fill="#c7d8ed">API de Machine Learning + ferramentas MCP explicáveis</text>
<rect x="78" y="300" width="1640" height="5" rx="2" fill="url(#line)"/>
<text x="78" y="385" font-family="Arial,sans-serif" font-size="29" font-weight="800" fill="#8edaff">FLUXO PASSO A PASSO</text>
<g><rect x="70" y="340" width="310" height="360" rx="26" fill="#101d36" stroke="#2563eb" stroke-width="3"/><circle cx="118" cy="392" r="27" fill="#2563eb"/><text x="118" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">1</text><text x="94" y="462" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#fff">PREPARAR DADOS</text><text x="94" y="518" font-family="Arial,sans-serif" font-size="24" fill="#dbeafe"><tspan x="94" dy="0">Definir conjunto de entrada e</tspan><tspan x="94" dy="34">alvo para classificação ou</tspan><tspan x="94" dy="34">regressão.</tspan></text></g><path d="M385 520 l22 0 m-9 -10 l10 10 -10 10" fill="none" stroke="#9fb7d7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="418" y="340" width="310" height="360" rx="26" fill="#101d36" stroke="#0d9488" stroke-width="3"/><circle cx="466" cy="392" r="27" fill="#0d9488"/><text x="466" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">2</text><text x="442" y="462" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#fff">TREINAR MODELO</text><text x="442" y="518" font-family="Arial,sans-serif" font-size="24" fill="#dbeafe"><tspan x="442" dy="0">Executar scripts de treino e</tspan><tspan x="442" dy="34">persistir o estimador</tspan><tspan x="442" dy="34">scikit-learn.</tspan></text></g><path d="M733 520 l22 0 m-9 -10 l10 10 -10 10" fill="none" stroke="#9fb7d7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="766" y="340" width="310" height="360" rx="26" fill="#101d36" stroke="#7c3aed" stroke-width="3"/><circle cx="814" cy="392" r="27" fill="#7c3aed"/><text x="814" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">3</text><text x="790" y="462" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#fff">CONSULTAR API</text><text x="790" y="518" font-family="Arial,sans-serif" font-size="24" fill="#dbeafe"><tspan x="790" dy="0">Enviar a requisição à API</tspan><tspan x="790" dy="34">Flask para obter a predição.</tspan></text></g><path d="M1081 520 l22 0 m-9 -10 l10 10 -10 10" fill="none" stroke="#9fb7d7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="1114" y="340" width="310" height="360" rx="26" fill="#101d36" stroke="#d97706" stroke-width="3"/><circle cx="1162" cy="392" r="27" fill="#d97706"/><text x="1162" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">4</text><text x="1138" y="462" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#fff">ACIONAR FERRAMENTAS</text><text x="1138" y="518" font-family="Arial,sans-serif" font-size="24" fill="#dbeafe"><tspan x="1138" dy="0">Usar o servidor MCP separado</tspan><tspan x="1138" dy="34">para análises determinísticas.</tspan></text></g><path d="M1429 520 l22 0 m-9 -10 l10 10 -10 10" fill="none" stroke="#9fb7d7" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g><rect x="1462" y="340" width="310" height="360" rx="26" fill="#101d36" stroke="#db2777" stroke-width="3"/><circle cx="1510" cy="392" r="27" fill="#db2777"/><text x="1510" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="800" fill="#fff">5</text><text x="1486" y="462" font-family="Arial,sans-serif" font-size="27" font-weight="800" fill="#fff">INSPECIONAR SAÍDA</text><text x="1486" y="518" font-family="Arial,sans-serif" font-size="24" fill="#dbeafe"><tspan x="1486" dy="0">Revisar resultado, metadados e</tspan><tspan x="1486" dy="34">limites antes de qualquer</tspan><tspan x="1486" dy="34">decisão.</tspan></text></g>
<rect x="76" y="770" width="1648" height="176" rx="28" fill="#0b1427" stroke="#47617e" stroke-width="2"/>
<text x="112" y="830" font-family="Arial,sans-serif" font-size="25" font-weight="800" fill="#8edaff">RESULTADO / LIMITE DO FLUXO</text>
<text x="112" y="890" font-family="Arial,sans-serif" font-size="30" fill="#fff">Predição demonstrativa + ferramentas de análise. Não é decisão validada em produção.</text>
<text x="78" y="995" font-family="Arial,sans-serif" font-size="21" fill="#93a9c4">Diagrama explicativo do fluxo documentado. Não representa captura de tela nem comprova integrações não implementadas.</text>
