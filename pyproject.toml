[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oraculo-x37"
version = "0.1.0"
description = "API de machine learning e ferramentas MCP para análise explicável."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Felipe Marcos de Abreu Aquino" }]
dependencies = [
  "scikit-learn==1.7.2",
  "numpy==1.24.0",
  "fastapi==0.109.0",
  "flask>=3.0,<4.0",
  "uvicorn==0.27.0",
  "gunicorn==27.0.1",
  "shap==0.49.1",
  "pandas==2.3.3",
  "matplotlib==3.7.0",
  "python-dotenv==1.0.0",
  "pydantic>=2.6,<2.14",
  "fastmcp>=2.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "black==23.7.0",
  "flake8==6.1.0",
  "ruff>=0.15.12",
  "mypy>=1.20.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--maxfail=1", "--disable-warnings", "-v"]

[tool.ruff]
line-length = 88

[tool.mypy]
files = ["app"]
disallow_untyped_defs = true

[tool.black]
line-length = 88
target-version = ["py310"]
