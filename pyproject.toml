[tool]
  licenses = ["MIT"]

[project]
  name = "oraculo-x37"
  version = "0.1.0"
  description = "A description of your project"
  authors = ["Felipe TJMG <profile@example.com>"]
  readme = "README.md"
  requires-python = ">=3.7"

[project.dependencies]
  scikit-learn = ">=1.5.1"
  numpy = ">=1.26.4"
  fastapi = ">=0.115.0"
  uvicorn = ">=0.30.1"
  gunicorn = ">=23.0.0"
  shap = ">=0.46.0"
  pandas = ">=2.2.3"
  matplotlib = ">=3.9.2"

[project.optional-dependencies]
  dev = [
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "black>=24.4.2",
    "ruff>=0.15.12",
    "mypy>=1.20.2"
  ]

[tool.ruff]
  line-length = 88

[tool.mypy]
  files = "src/"
  disallow-untyped-defs = true

[tool.black]
  line-length = 88
  target-version = ['py37']

[tool.pytest]
  testpaths = ["tests"]
  addopts = "--maxfail=1 --disable-warnings -v"
